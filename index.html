<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CVC - Collège Jean Lurçat</title>

<style>
body{
font-family:Arial;
background:#0a3d62;
color:white;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
color:black;
padding:15px;
margin-top:10px;
border-radius:10px;
}

input,textarea,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:none;
}

button{
background:#1e90ff;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🎓 CVC Jean Lurçat</h1>

<input type="password" id="pwd" placeholder="Mot de passe">
<button onclick="login()">Connexion</button>

<div id="app" style="display:none">

<h2>Ajouter un projet</h2>

<input id="title" placeholder="Titre">
<textarea id="desc" placeholder="Description"></textarea>

<button onclick="add()">Ajouter</button>

<h2>Projets</h2>
<div id="list"></div>

</div>

</div>

<script>

const SUPABASE_URL = "https://ryrsuokvoqqtnxihicuk.supabase.co";
const SUPABASE_KEY = "TA_CLE_ANON";

const sitePwd = "1234";
const adminPwd = "cvc46";

/* LOGIN */
function login(){
if(document.getElementById("pwd").value === sitePwd){
document.getElementById("app").style.display="block";
load();
}else{
alert("Mot de passe incorrect");
}
}

/* CHARGER */
async function load(){

const res = await fetch(SUPABASE_URL + "/rest/v1/proposals?select=*",
{
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
}
});

const data = await res.json();
render(data);
}

/* AFFICHAGE */
function render(data){
const list = document.getElementById("list");
list.innerHTML="";

data.forEach(p=>{
list.innerHTML += `
<div class="card">
<h3>${p.title}</h3>
<p>${p.description}</p>
<p>👍 Votes : ${p.votes}</p>

<button onclick="vote(${p.id},${p.votes})">Voter</button>
<button onclick="reply(${p.id})">Répondre</button>
<button onclick="del(${p.id})">Supprimer</button>
</div>
`;
});
}

/* AJOUT */
async function add(){

const t = document.getElementById("title").value;
const d = document.getElementById("desc").value;

if(!t || !d){
alert("Remplis tout");
return;
}

await fetch(SUPABASE_URL + "/rest/v1/proposals",{
method:"POST",
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
title:t,
description:d,
votes:0,
responses:[]
})
});

load();
}

/* VOTE */
async function vote(id,votes){

if(localStorage.getItem("v"+id)){
alert("Déjà voté");
return;
}

await fetch(SUPABASE_URL + "/rest/v1/proposals?id=eq."+id,{
method:"PATCH",
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
votes:votes+1
})
});

localStorage.setItem("v"+id,true);
load();
}

/* SUPPRESSION ADMIN */
async function del(id){

const p = prompt("Mot de passe admin");

if(p !== adminPwd){
alert("Accès refusé");
return;
}

await fetch(SUPABASE_URL + "/rest/v1/proposals?id=eq."+id,{
method:"DELETE",
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
}
});

load();
}

/* RÉPONSE ADMIN */
async function reply(id){

const p = prompt("Mot de passe admin");

if(p !== adminPwd){
alert("Accès refusé");
return;
}

const r = prompt("Réponse :");

const res = await fetch(SUPABASE_URL + "/rest/v1/proposals?id=eq."+id,
{
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
}
});

const data = await res.json();
let responses = data[0].responses || [];

responses.push(r);

await fetch(SUPABASE_URL + "/rest/v1/proposals?id=eq."+id,{
method:"PATCH",
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
responses:responses
})
});

load();
}

</script>

</body>
</html>
