<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CVC Temps Réel</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0a3d62,#3c6382);
color:white;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
color:black;
padding:15px;
margin-top:10px;
border-radius:10px;
}

input,textarea,button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
background:#1e90ff;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🎓 CVC - Temps réel</h1>

<input type="password" id="pwd" placeholder="Mot de passe">
<button onclick="login()">Connexion</button>

<div id="app" style="display:none">

<h2>Proposer un projet</h2>

<input id="title" placeholder="Titre">
<textarea id="desc" placeholder="Description"></textarea>

<button onclick="add()">Ajouter</button>

<h2>Projets</h2>
<div id="list"></div>

</div>

</div>

<script>
const SUPABASE_URL = "https://ryrsuokvoqqtnxihicuk.supabase.co";
const SUPABASE_KEY = "TA_CLE_ANON";

const sitePwd = "1234";

function login(){
if(pwd.value === sitePwd){
app.style.display="block";
load();
setInterval(load, 1000);
}else alert("Erreur mot de passe");
}

async function load(){
const res = await fetch(SUPABASE_URL + "/rest/v1/proposals?select=*",
{
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
}
});

const data = await res.json();
render(data);
}

function render(data){
list.innerHTML="";

data.forEach(p=>{
list.innerHTML += `
<div class="card">
<h3>${p.title}</h3>
<p>${p.description}</p>
<p>👍 Votes : ${p.votes}</p>

<button onclick="vote(${p.id},${p.votes})">Voter</button>
</div>
`;
});
}

async function vote(id,votes){

if(localStorage.getItem("v"+id)){
alert("Déjà voté");
return;
}

await fetch(SUPABASE_URL + "/rest/v1/proposals?id=eq."+id,{
method:"PATCH",
headers:{
apikey: SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
votes:votes+1
})
});

localStorage.setItem("v"+id,true);
load();
}
</script>

</body>
</html>
