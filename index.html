<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CVC - Collège Jean Lurçat</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0a3d62,#3c6382);
margin:0;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
color:black;
padding:15px;
margin-top:10px;
border-radius:10px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:5px;
border:none;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
cursor:pointer;
background:#1e90ff;
color:white;
}

button:hover{
background:#3742fa;
}
</style>

</head>

<body>

<div class="container">

<h1>🎓 CVC - Collège Jean Lurçat</h1>

<input type="password" id="pwd" placeholder="Mot de passe">
<button onclick="login()">Connexion</button>

<div id="app" style="display:none">

<h2>Proposer un projet</h2>

<input id="title" placeholder="Titre du projet">
<textarea id="desc" placeholder="Description"></textarea>

<button onclick="add()">Ajouter</button>

<h2>Projets</h2>
<div id="list"></div>

</div>

</div>

<script>

const sitePwd = "1234";
const adminPwd = "cvc46";

let data = JSON.parse(localStorage.getItem("data") || "[]");

function login(){
if(document.getElementById("pwd").value === sitePwd){
document.getElementById("app").style.display="block";
load();
}else{
alert("Mot de passe incorrect");
}
}

/* AJOUT PROJET */
function add(){
const t = document.getElementById("title").value;
const d = document.getElementById("desc").value;

if(!t || !d){
alert("Remplis tous les champs");
return;
}

data.push({
title:t,
desc:d,
votes:0,
voted:false,
responses:[]
});

save();
load();

title.value="";
desc.value="";
}

/* VOTE */
function vote(i){
if(data[i].voted){
alert("Déjà voté !");
return;
}

data[i].votes++;
data[i].voted = true;

save();
load();
}

/* SUPPRESSION ADMIN */
function del(i){
const p = prompt("Mot de passe admin");

if(p !== adminPwd){
alert("Accès refusé");
return;
}

data.splice(i,1);
save();
load();
}

/* RÉPONSE ADMIN */
function reply(i){
const p = prompt("Mot de passe admin");

if(p !== adminPwd){
alert("Accès refusé");
return;
}

const r = prompt("Ta réponse :");

if(!r) return;

data[i].responses.push(r);

save();
load();
}

/* AFFICHAGE */
function load(){
const list = document.getElementById("list");
list.innerHTML="";

data.forEach((p,i)=>{

let responsesHTML = "";

if(p.responses){
p.responses.forEach(r=>{
responsesHTML += `<p>💬 ${r}</p>`;
});
}

list.innerHTML += `
<div class="card">
<h3>${p.title}</h3>
<p>${p.desc}</p>
<p>👍 Votes : ${p.votes}</p>

<button onclick="vote(${i})">Voter</button>
<button onclick="reply(${i})">Répondre (admin)</button>
<button onclick="del(${i})">Supprimer (admin)</button>

${responsesHTML}
</div>
`;
});
}

/* SAUVEGARDE */
function save(){
localStorage.setItem("data", JSON.stringify(data));
}

load();

</script>

</body>
</html>
